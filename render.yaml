services:
  # ───────────────────────────────────────────────────────────────────────────
  # Backend Web Service (FastAPI + TensorFlow)
  # ───────────────────────────────────────────────────────────────────────────
  - type: web
    name: multi-organ-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_DIR
        value: "./models"
      - key: RESNET50_MODEL_URL
        sync: false
      - key: MOBILENETV2_MODEL_URL
        sync: false

  # ───────────────────────────────────────────────────────────────────────────
  # Frontend Static Site (React + Vite + Tailwind CSS)
  # ───────────────────────────────────────────────────────────────────────────
  - type: static
    name: multi-organ-ai-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: multi-organ-ai-backend
          property: host
